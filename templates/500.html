<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>500 - Server Error | ImageTag AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        .server-error {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px;
        }

        .server-content {
            max-width: 650px;
        }

        .number {
            font-size: 110px;
            font-weight: 800;
            line-height: 1;
            color: #dc2626;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 15px;
        }

        p {
            color: #6b7280;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 13px 22px;
            border-radius: 9px;
            text-decoration: none;
            font-weight: 600;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }

        .btn-secondary {
            background: #f3f4f6;
            color: #374151;
        }
    </style>
</head>

<body>

{% include 'navbar.html' %}

<main class="server-error">

    <div class="server-content">

        <div class="number">
            500
        </div>

        <h1>
            Internal Server Error
        </h1>

        <p>
            Something went wrong while processing your request.
            Please try again later.
        </p>

        <div class="actions">

            <a href="{{ url_for('dashboard') }}"
               class="btn btn-primary">
                Go to Dashboard
            </a>

            <a href="{{ url_for('index') }}"
               class="btn btn-secondary">
                Return Home
            </a>

        </div>

    </div>

</main>

</body>
</html>
