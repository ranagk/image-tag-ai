<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 - Page Not Found | ImageTag AI</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%234f46e5'/><text x='50' y='50' dominant-baseline='central' text-anchor='middle' font-family='sans-serif' font-weight='bold' font-size='40' fill='white'>AI</text></svg>">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        .not-found {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px;
        }

        .not-found-content {
            max-width: 650px;
        }

        .number {
            font-size: 110px;
            font-weight: 800;
            line-height: 1;
            color: #2563eb;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 15px;
        }

        p {
            color: #6b7280;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            padding: 13px 22px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 9px;
            font-weight: 600;
        }
    </style>
</head>

<body>

{% include 'navbar.html' %}

<main class="not-found">

    <div class="not-found-content">

        <div class="number">
            404
        </div>

        <h1>
            Page Not Found
        </h1>

        <p>
            Sorry, the page you are looking for does not exist
            or may have been moved.
        </p>

        <a href="{{ url_for('index') }}"
           class="btn">
            Return to Home
        </a>

    </div>

</main>

</body>
</html>
