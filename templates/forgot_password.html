<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password - ImageTag AI</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%234f46e5'/><text x='50' y='50' dominant-baseline='central' text-anchor='middle' font-family='sans-serif' font-weight='bold' font-size='40' fill='white'>AI</text></svg>">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page">
    
<div class="auth-wrapper">
    <section class="auth-info">
        <a href="/" class="auth-logo"><span>IA</span> Image Analysis</a>
        <div class="auth-info-content">
            <span class="hero-badge">ACCOUNT RECOVERY</span>
            <h1>Don't worry, we got you.</h1>
            <p>Enter your email address and we'll send you a link to reset your password.</p>
        </div>
    </section>
    <main class="auth-form-area">
        <div class="auth-form-card">
            <h2>Forgot Password?</h2>
            <p class="auth-subtitle">Enter your registered email address below.</p>
            
            <form method="POST" action="{{ url_for('forgot_password') }}">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>
                <button type="submit" class="btn btn-primary btn-full">Send Reset Link</button>
            </form>
            <p class="auth-switch" style="margin-top: 20px;">
                Remember your password? <a href="{{ url_for('login') }}">Login</a>
            </p>
        </div>
    </main>
</div>
</body>
</html>
